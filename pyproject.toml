[project]
name = "csms-v2"
version = "0.1.0"
description = "Central Store Management System V2"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.2",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
