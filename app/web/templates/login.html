<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CSMS V2 — Sign in</title>
  <link rel="stylesheet" href="/static/css/csms.css?v=2.3">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="login-page">
<div class="login-card">
  <div class="brand centered">
    <div class="brand-mark">CS</div>
    <div>
      <div class="brand-title">CSMS V2</div>
      <div class="brand-subtitle">Central Store Management System</div>
    </div>
  </div>
  <h1>Sign in</h1>
  <p class="muted">Use your authorized credentials to continue.</p>
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>
      Username
      <input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" required {% if not username %}autofocus{% endif %}>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required {% if username %}autofocus{% endif %}>
    </label>
    
    <!-- Numbers-based Security CAPTCHA -->
    <div class="captcha-block">
      <label for="captcha_input">Security Verification</label>
      <div class="captcha-row">
        <div id="captcha-image" class="captcha-visual" title="Security numbers">{{ captcha_svg|safe }}</div>
        <button type="button" class="button button-outline captcha-refresh-btn" onclick="refreshCaptcha()" title="Get new numbers">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
          <span class="refresh-text">Refresh</span>
        </button>
      </div>
      <input type="hidden" name="captcha_token" id="captcha_token" value="{{ captcha_token }}">
      <input type="text" name="captcha_input" id="captcha_input" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="Enter the 5 numbers shown above" required autocomplete="off">
    </div>

    <button class="button primary login-btn" type="submit">Sign in</button>
  </form>
  <div class="login-note">Protected government inventory portal. Access is audited and monitored.</div>
</div>

<script>
function refreshCaptcha() {
  var btn = document.querySelector('.captcha-refresh-btn');
  if (btn) btn.classList.add('spinning');
  fetch('/api/captcha')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      document.getElementById('captcha-image').innerHTML = data.svg;
      document.getElementById('captcha_token').value = data.token;
      var input = document.getElementById('captcha_input');
      input.value = '';
      input.focus();
    })
    .catch(function(err) {
      console.error('Failed to load new captcha', err);
    })
    .finally(function() {
      if (btn) btn.classList.remove('spinning');
    });
}

// Auto-refresh captcha if user navigates back to /login via browser history
window.addEventListener('pageshow', function (event) {
  if (event.persisted || (window.performance && window.performance.getEntriesByType && window.performance.getEntriesByType('navigation')[0] && window.performance.getEntriesByType('navigation')[0].type === 'back_forward')) {
    refreshCaptcha();
  }
});
</script>
</body>
</html>
