<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSMS V2 — Sign in</title>
  <link rel="stylesheet" href="/static/css/csms.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="brand centered">
    <div class="brand-mark">CS</div>
    <div>
      <div class="brand-title">CSMS V2</div>
      <div class="brand-subtitle">Central Store Management System</div>
    </div>
  </div>
  <h1>Sign in</h1>
  <p class="muted">Use your CSMS account to continue.</p>
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button primary" type="submit">Sign in</button>
  </form>
  <div class="login-note">Authentication and store permissions are enforced by the CSMS backend.</div>
</div>
</body>
</html>
