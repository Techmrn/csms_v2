services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csms_app
    restart: unless-stopped
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
